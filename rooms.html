<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sohbet odaları - Sohbetix</title><link rel="stylesheet" href="styles.css"><meta name="theme-color" content="#ffffff">
</head>
<body class="admin-page">
<header class="admin-top">
  <div class="admin-wrap admin-nav">
    <a class="brand" href="index.html">Sohbet<span>ix</span></a>
    <a class="admin-nav-link active" href="dashboard.html">SOHBET KONTROL PANELİ</a>
    <span class="admin-nav-link disabled">JETONLAR — 🪙 0</span>
    <div class="admin-user">👤 Sohbetix Kullanıcısı ▾</div>
  </div>
</header>

<main class="admin-main"><div class="admin-wrap">

<div class="admin-breadcrumb">
  <a class="root" href="dashboard.html">Kontrol paneli</a>
  <span class="sep">→</span>
  <strong>Sohbetix</strong>
  <span class="sep">→</span>
  <span>Ayarlar</span>
  <a class="admin-open-chat" href="open-chat.html" target="_blank">↗ Sohbeti aç</a>
</div>

<div class="admin-tabs">
<a class="admin-tab" href="settings.html">Ana ayarlar</a>
<a class="admin-tab active" href="rooms.html">Odalar</a>
<a class="admin-tab" href="domain.html">Sohbet adresi (alan adı)</a>
</div>

<div class="rooms-layout">
<aside class="room-list">
<div class="room-item">Ana sayfa ✥</div>
<a class="new-room" href="#">✚ Yeni sekme</a>
</aside>

<section class="room-settings">
<h1 class="smiley-title" style="margin-top:0">Oda ayarları</h1>
<div class="admin-row"><label>Başlık:</label><input class="wide" type="text" value="Ana sayfa"></div>
<label class="admin-check"><input type="checkbox" checked> Odayı varsayılan olarak sohbet sekmelerinde göster</label>
<label class="admin-check"><input type="checkbox" checked> Kullanıcı giriş/çıkış mesajlarını göster</label>
<label class="admin-check"><input type="checkbox"> Gizli oda</label>
<label class="admin-check"><input type="checkbox"> Odanın kapatılmasına izin ver</label>
<label class="admin-check"><input type="checkbox"> Karşılama mesajı <span class="pro-badge" style="background:#58b8d8">Markdown</span></label>
<div class="admin-row"><textarea class="wide" placeholder="Süper sohbet odamıza hoş geldiniz!"></textarea></div>

<h2 class="admin-section-title">Spam koruması ve erişim kontrolü</h2>
<div class="admin-row"><label>İzin verilen minimum kullanıcı yaşı:</label><input class="wide" type="number"></div>
<div class="admin-row"><label>Mesajları okuyabilecekler:</label><select class="wide"><option>Tüm kullanıcılar</option><option>Odaya girenler</option></select></div>
<div class="admin-row"><label>Odaya girebilecekler:</label><select class="wide"><option>Sohbete girenler</option><option>Kayıtlı kullanıcılar</option></select></div>
<div class="admin-row"><label>Mesaj gönderebilecekler:</label><select class="wide"><option>Odaya girenler</option><option>Kayıtlı kullanıcılar</option></select></div>
<div class="admin-row"><label>Bağlantı gönderebilecekler:</label><select class="wide"><option>Odaya girenler</option><option>Kayıtlı kullanıcılar</option></select></div>
<div class="admin-row"><label>Maksimum mesaj uzunluğu:</label><input class="wide" type="number" value="512"></div>
<label class="admin-check"><input type="checkbox" checked disabled> Flood kontrolü</label>
<label class="admin-check"><input type="checkbox"> Kötü kelimeleri engelleme <span class="pro-badge">PRO</span></label>
<button class="admin-save">Değişiklikleri kaydet</button>
</section>
</div>
</div></main>
<footer class="admin-footer">
  <div class="admin-wrap footer-inner">
    <div>© 2026 Sohbetix</div>
    <select><option>Türkçe</option><option>English</option></select>
  </div>
</footer>
</body></html>
